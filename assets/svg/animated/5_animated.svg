  <defs>
    <style>
      .layer-slow   { transform-origin: 322.5px 323.5px; animation: spin-cw  18s linear infinite; }
      .layer-medium { transform-origin: 322.5px 323.5px; animation: spin-ccw 12s linear infinite; }
      .layer-fast   { transform-origin: 322.5px 323.5px; animation: spin-cw   7s linear infinite; }
      .layer-pulse  { transform-origin: 322.5px 323.5px; animation: pulse-scale 4s ease-in-out infinite; }
      .layer-static { /* no animation */ }
      @keyframes spin-cw   { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
      @keyframes spin-ccw  { from { transform: rotate(0deg);   } to { transform: rotate(-360deg); } }
      @keyframes pulse-scale { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
  </defs>

